{{define "component/themeSwitchTemplate"}}
<template>
  <span></span>
</template>
{{end}}

{{define "component/themeSwitchTemplateLogin"}}
<template>
  <span></span>
</template>
{{end}}

{{define "component/aThemeSwitch"}}
<script>
  function createThemeSwitcher() {
    const ENGINE_THEME_KEY = 'xui-customization-theme';
    const normalizeTheme = (theme) => ['light', 'dark', 'ultra-dark'].includes(theme) ? theme : 'light';
    localStorage.removeItem('dark-mode');
    localStorage.removeItem('isUltraDarkThemeEnabled');
    const initialTheme = normalizeTheme(localStorage.getItem(ENGINE_THEME_KEY));
    const isUltra = initialTheme === 'ultra-dark';
    const isDarkTheme = initialTheme === 'dark' || isUltra;
    function updateDocumentTheme(theme) {
      theme = normalizeTheme(theme);
      const isUltra = theme === 'ultra-dark';
      const baseTheme = theme === 'dark' || isUltra ? 'dark' : 'light';
      if (isUltra) {
        document.documentElement.setAttribute('data-theme', 'ultra-dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      document.body.setAttribute('class', baseTheme);
      const app = document.getElementById('app');
      if (app) {
        app.classList.remove('light', 'dark');
        app.classList.add(baseTheme);
      }
      const message = document.getElementById('message');
      if (message) message.className = baseTheme;
      localStorage.setItem(ENGINE_THEME_KEY, theme);
    }
    updateDocumentTheme(initialTheme);
    return {
      isDarkTheme,
      isUltra,
      get currentTheme() {
        return this.isDarkTheme ? 'dark' : 'light';
      },
      setTheme(theme) {
        theme = normalizeTheme(theme);
        const isUltraTheme = theme === 'ultra-dark';
        const isDark = theme === 'dark' || isUltraTheme;
        this.isDarkTheme = isDark;
        this.isUltra = isUltraTheme;
        updateDocumentTheme(theme);
      }
    };
  }
  const themeSwitcher = createThemeSwitcher();
  window.themeSwitcher = themeSwitcher;
  if (window.CustomizationEngine) {
    window.CustomizationEngine.applyThemePreference(themeSwitcher);
  }
  Vue.component('a-theme-switch', {
    template: `{{template "component/themeSwitchTemplate"}}`,
    data: () => ({
      themeSwitcher
    }),
    mounted() {
      this.$message.config({
        getContainer: () => document.getElementById('message')
      });
      const message = document.getElementById('message');
      if (message) message.className = themeSwitcher.currentTheme;
      if (window.CustomizationEngine) {
        window.CustomizationEngine.applyThemePreference(themeSwitcher);
      }
    }
  });
  Vue.component('a-theme-switch-login', {
    template: `{{template "component/themeSwitchTemplateLogin"}}`,
    data: () => ({
      themeSwitcher
    }),
    mounted() {
      this.$message.config({
        getContainer: () => document.getElementById('message')
      });
      const message = document.getElementById('message');
      if (message) message.className = themeSwitcher.currentTheme;
      if (window.CustomizationEngine) {
        window.CustomizationEngine.applyThemePreference(themeSwitcher);
      }
    }
  });
</script>
{{end}}
