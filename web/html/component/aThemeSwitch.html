{{define "component/themeSwitchTemplate"}}
<template>
  <span></span>
</template>
{{end}}

{{define "component/themeSwitchTemplateLogin"}}
<template>
  <span></span>
</template>
{{end}}

{{define "component/aThemeSwitch"}}
<script>
  function createThemeSwitcher() {
    localStorage.removeItem('dark-mode');
    localStorage.removeItem('isUltraDarkThemeEnabled');
    const isUltra = false;
    const isDarkTheme = false;
    function updateDocumentTheme(isDark, isUltra) {
      if (isUltra) {
        document.documentElement.setAttribute('data-theme', 'ultra-dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      const baseTheme = isDark ? 'dark' : 'light';
      [document.body, document.getElementById('app'), document.getElementById('message')].forEach(element => {
        if (!element) return;
        element.classList.remove('light', 'dark');
        element.classList.add(baseTheme);
      });
    }
    updateDocumentTheme(isDarkTheme, isUltra);
    return {
      isDarkTheme,
      isUltra,
      get currentTheme() {
        return this.isDarkTheme ? 'dark' : 'light';
      },
      setTheme(theme) {
        const isUltraTheme = theme === 'ultra-dark';
        const isDark = theme === 'dark' || isUltraTheme;
        this.isDarkTheme = isDark;
        this.isUltra = isUltraTheme;
        updateDocumentTheme(this.isDarkTheme, this.isUltra);
      }
    };
  }
  const themeSwitcher = createThemeSwitcher();
  window.themeSwitcher = themeSwitcher;
  if (window.CustomizationEngine) {
    window.CustomizationEngine.applyThemePreference(themeSwitcher);
  }
  Vue.component('a-theme-switch', {
    template: `{{template "component/themeSwitchTemplate"}}`,
    data: () => ({
      themeSwitcher
    }),
    mounted() {
      this.$message.config({
        getContainer: () => document.getElementById('message')
      });
      const message = document.getElementById('message');
      if (message) message.className = themeSwitcher.currentTheme;
      if (window.CustomizationEngine) {
        window.CustomizationEngine.applyThemePreference(themeSwitcher);
      }
    }
  });
  Vue.component('a-theme-switch-login', {
    template: `{{template "component/themeSwitchTemplateLogin"}}`,
    data: () => ({
      themeSwitcher
    }),
    mounted() {
      this.$message.config({
        getContainer: () => document.getElementById('message')
      });
      const message = document.getElementById('message');
      if (message) message.className = themeSwitcher.currentTheme;
      if (window.CustomizationEngine) {
        window.CustomizationEngine.applyThemePreference(themeSwitcher);
      }
    }
  });
</script>
{{end}}
